  <script>
    (function () {
      var redirectPath = sessionStorage.getItem("redirectPath");
      if (redirectPath) {
        sessionStorage.removeItem("redirectPath");
        window.history.replaceState(null, "", redirectPath);
      }
      // The immersive pages are dark; paint that before React boots so they
      // never flash white. Product and policy pages keep their light theme.
      var path = window.location.pathname.replace(/\/+$/, "") || "/";
      if (path === "/" || path === "/projects" || path === "/contact") {
        document.documentElement.className += " theme-dark";
      }
    })();
  </script>
  <style>
    html.theme-dark,
    html.theme-dark body {
      background: #06070a;
    }
  </style>
